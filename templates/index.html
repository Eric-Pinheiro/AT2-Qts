<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Portal de Provisionamento</title>
</head>
<body>
    <main>
        <h1>Registrar Nova Workstation</h1>
        <form id="provision-form">
            <div>
                <label for="hostname">Hostname da Máquina</label>
                <input type="text" id="hostname" name="hostname" required>
            </div>
            <div>
                <label for="os_version">Versão do Sistema Operacional</label>
                <input type="text" id="os_version" name="os_version" required>
            </div>
            <button type="submit">Provisionar</button>
        </form>
        <div id="result" role="alert" tabindex="-1"></div>
    </main>
</body>
</html>
